$schema: https://json-schema.org/draft/2020-12/schema
type: array
items:
  type: object
  additionalProperties: false
  required:
    - nightlord
    - day
    - points
    - date
    - image
    - excluded
    - status
    - note
  properties:
    nightlord:
      type: string
      enum:
        - Gladius
        - Gladius-everdark
        - Adel
        - Adel-everdark
        - Gnoster
        - Gnoster-everdark
        - Maris
        - Maris-everdark
        - Libra
        - Libra-everdark
        - Fulghor
        - Fulghor-everdark
        - Caligo
        - Caligo-everdark
        - Harmonia
        - Harmonia-everdark
        - Straghess
        - Heolstor
    day:
      type: string
      enum: [day0, day1, day2, day3, day3-victory]
    team:
      type: array
      items:
        type: string
    points:
      type: integer
      minimum: -1
    date:
      type: string
      pattern: '^[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
    image:
      type: string
      pattern: '^[^\\/:*?"<>|]+[.]jpg$'
    excluded:
      type: boolean
    status:
      type: string
    note:
      anyOf:
        - type: "null"
        - type: string
    outdated:
      type: boolean
