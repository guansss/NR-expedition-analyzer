<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NR Expedition Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-a: #edf8ff;
        --bg-b: #fef8ee;
        --card: #ffffff;
        --ink: #1f2a37;
        --accent: #0f766e;
        --muted: #667085;
        --nightlord-everdark: #5427a3;
        --victory: #e8f8e8;
        --defeat: #f8e8e8;
      }

      body {
        background:
          radial-gradient(circle at 0% 0%, var(--bg-a), transparent 45%),
          radial-gradient(circle at 100% 0%, var(--bg-b), transparent 35%), #f8fafc;
        color: var(--ink);
      }

      .page-wrap {
        max-width: 1360px;
      }

      .stat-card {
        background: var(--card);
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .chart-panel,
      .table-panel {
        background: var(--card);
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        overflow-x: auto;
      }

      .chart {
        width: 100%;
        height: 320px;
      }

      .date {
        color: var(--muted);
        font-size: 0.8em;
      }

      .nightlord {
        font-weight: 600;
      }

      .victory-row {
        background: var(--victory);
      }

      .defeat-row {
        background: var(--defeat);
      }

      .quit-row {
        background: #fff7d6;
      }

      .disconnected-row {
        background: #f1f5f9;
      }

      .invalid-row {
        opacity: 0.5;
      }

      .points-diff {
        margin-left: 4px;
        font-size: 0.8em;
        color: var(--muted);
      }

      .image-icon {
        --bs-btn-bg: transparent;
        --bs-btn-border-color: transparent;
      }

      #hover-preview {
        position: fixed;
        z-index: 1100;
        display: none;
        border: 1px solid #d0d5dd;
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
        padding: 6px;
      }

      #hover-preview img {
        display: block;
      }

      .table {
        --bs-table-bg: transparent;
        font-size: 0.9rem;
      }

      .table td,
      .table th {
        white-space: nowrap;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid page-wrap py-4">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h1 class="h3 mb-1">Expedition Report</h1>
          <div class="muted">Generated at __GENERATED_AT__</div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stat-card">
            <div class="muted" id="label-total">Total</div>
            <div class="stat-value" id="total-expeditions">0</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stat-card">
            <div class="muted" id="label-victories">Victories</div>
            <div class="stat-value" id="total-victories">0</div>
          </div>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-12">
          <div class="chart-panel">
            <h2 class="h5 mb-3">Points Trend</h2>
            <div class="chart" id="points-chart"></div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <div class="chart-panel">
            <h2 class="h5 mb-3">Status Distribution</h2>
            <div class="chart" id="status-chart"></div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="chart-panel">
            <h2 class="h5 mb-3">Nightlord Distribution</h2>
            <div class="chart" id="nightlord-chart"></div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <div class="chart-panel">
            <h2 class="h5 mb-3">Played As</h2>
            <div class="chart" id="character-chart"></div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="chart-panel">
            <h2 class="h5 mb-3">Teammates</h2>
            <div class="chart" id="teammates-chart"></div>
          </div>
        </div>
      </div>

      <div class="table-panel">
        <h2 class="h5 mb-3">Expeditions</h2>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="expedition-table">
            <thead class="table-light">
              <tr id="expedition-header"></tr>
            </thead>
            <tbody id="expedition-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="hover-preview"><img src="" alt="preview" /></div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>
      const expeditions = __EXPEDITIONS_JSON__
      const translations = __TRANSLATIONS_JSON__
      const preview = document.getElementById("hover-preview")
      const previewImage = preview.querySelector("img")

      const HIDE_DATE = expeditions.some((row) => row.date === undefined || row.date === null)
      const COLUMNS = ["number", "nightlord", "day", "team", "points", "image", "status", "note"]
      if (!HIDE_DATE) {
        COLUMNS.unshift("date")
      }

      function t(section, key, fallback) {
        if (translations && translations[section] && translations[section][key] !== undefined) {
          return translations[section][key]
        }
        return fallback
      }

      function displayDay(value) {
        return t("days", value, value)
      }

      function displayNightlord(value) {
        return t("nightlords", value, value)
      }

      function displayCharacter(value) {
        return t("nightfarers", value, value)
      }

      function displayStatus(value) {
        return t("status", value, value)
      }

      function displayDepth(value) {
        return t("depths", value, value)
      }

      function setStats(visibleRows) {
        const total = visibleRows.length
        const victories = visibleRows.filter((row) => row.status === "victory").length

        document.getElementById("total-expeditions").textContent = String(total)
        document.getElementById("total-victories").textContent = String(victories)
        document.getElementById("label-total").textContent = "总场次"
        document.getElementById("label-victories").textContent = "胜利场次"
      }

      function renderHeader() {
        const header = document.getElementById("expedition-header")
        header.innerHTML = ""
        COLUMNS.forEach((key) => {
          const th = document.createElement("th")
          th.textContent = t("UI", key, key)
          header.appendChild(th)
        })
      }

      function showPreview(src, event) {
        const button = event.target
        const row = button.closest("tr")
        previewImage.onload = () => {
          const buttonRect = button.getBoundingClientRect()
          const rowRect = row.getBoundingClientRect()
          previewImage.style.maxWidth = `${rowRect.width}px`
          preview.style.left = `${rowRect.left}px`
          preview.style.top = `${(rowRect.height - previewImage.naturalHeight) / 2 + rowRect.top}px`
        }
        previewImage.src = src
        preview.style.display = "block"
      }

      function hidePreview() {
        if (preview.style.display !== "none") {
          preview.style.display = "none"
          previewImage.src = ""
        }
      }

      function renderTable(visibleRows) {
        const body = document.getElementById("expedition-body")
        body.innerHTML = ""
        const statusClassMap = {
          victory: "victory-row",
          defeat: "defeat-row",
          quit: "quit-row",
          disconnected: "disconnected-row",
          invalid: "invalid-row",
        }

        visibleRows.forEach((row, rowIndex) => {
          const tr = document.createElement("tr")
          const statusClass = statusClassMap[row.status]
          if (statusClass) tr.classList.add(statusClass)

          COLUMNS.forEach((column) => {
            const td = document.createElement("td")
            const value = row[column]

            if (column === "nightlord") {
              td.textContent = displayNightlord(String(value))
              td.className = "nightlord"
              if (String(value).endsWith("-everdark")) {
                td.style.color = "var(--nightlord-everdark)"
              }
            } else if (column === "day") {
              td.textContent = displayDay(String(value))
            } else if (column === "status") {
              td.textContent = displayStatus(String(value))
            } else if (column === "team") {
              td.textContent = Array.isArray(value) ? value.map(displayCharacter).join(", ") : ""
            } else if (column === "image") {
              const button = document.createElement("button")
              button.className = "image-icon btn btn-light btn-sm"
              button.type = "button"
              button.textContent = "📷"
              const src = `crops/${value}`
              button.addEventListener("click", (event) => showPreview(src, event))
              td.appendChild(button)
            } else if (column === "date") {
              td.className = "date"
              td.style.color = "var(--muted)"
              td.textContent = value === null || value === undefined ? "" : String(value)
            } else if (column === "points") {
              const points = document.createElement("span")
              points.textContent = value
              td.appendChild(points)

              const nextRow = visibleRows[rowIndex + 1]
              if (nextRow && nextRow.points !== -1) {
                const diff = value - nextRow.points
                const diffSpan = document.createElement("span")
                diffSpan.textContent = ` (${diff >= 0 ? "+" : ""}${diff})`
                diffSpan.className = "points-diff"
                td.appendChild(diffSpan)
              }
            } else {
              td.textContent = value === null || value === undefined ? "" : String(value)
            }

            tr.appendChild(td)
          })

          body.appendChild(tr)
        })

        document.addEventListener("click", (event) => {
          if (!(event.target && event.target.className.includes("image-icon"))) {
            hidePreview()
          }
        })
      }

      function renderPointsChart(rows) {
        rows = rows.slice().reverse()
        const pointColorsMap = {
          victory: "#16a34a",
          defeat: "#dc2626",
          quit: "#facc15",
          disconnected: "#94a3b8",
          _default: "#adb0b3",
        }
        const chart = echarts.init(document.getElementById("points-chart"))
        const xAxisData = rows.map((_, idx) => String(idx + 1))
        const pointsData = rows.map((row) => {
          if (row.points === -1) {
            return null
          }
          return {
            value: row.points,
            itemStyle: {
              color: pointColorsMap[row.status] || pointColorsMap._default,
            },
          }
        })
        const depthRanks = [
          { name: "D1", cap: 1000, color: "#f7f5fb" },
          { name: "D2", cap: 2000, color: "#e8e2f4" },
          { name: "D3", cap: 4000, color: "#d9ceed" },
          { name: "D4", cap: 6000, color: "#cabae6" },
          { name: "D5", cap: 9999, color: "#b39ddb" },
        ]
        function getDepthRank(points) {
          return depthRanks.find((rank) => points < rank.cap) || depthRanks[depthRanks.length - 1]
        }
        const depthSeries = Object.fromEntries(
          depthRanks.map((rank) => [
            rank.name,
            {
              type: "line",
              // showSymbol: false,
              silent: true,
              emphasis: { disabled: true },
              connectNulls: false,
              name: displayDepth(rank.name),
              data: [],
              itemStyle: { opacity: 0, color: rank.color },
              lineStyle: { width: 0 },
              areaStyle: { color: rank.color },
            },
          ]),
        )

        // If expedition n has points that fit in a rank, then expedition n+1 should be in this rank.
        let currentRank = null
        for (let i = 0; i < pointsData.length; i++) {
          const item = pointsData[i]
          if (item === null) {
            Object.values(depthSeries).forEach((series) => series.data.push(null))
            continue
          }
          // The first expedition's rank can't be determined, so we have to assume its rank matches its points.
          if (currentRank === null) {
            currentRank = getDepthRank(item.value)
          }
          const nextRank = getDepthRank(item.value)
          Object.entries(depthSeries).forEach(([name, series]) => {
            if (name === currentRank.name || name === nextRank.name) {
              series.data.push(item.value)
            } else {
              series.data.push(null)
            }
          })
          currentRank = nextRank
        }

        chart.setOption({
          grid: { left: 10, right: 10, top: 20, bottom: 40, containLabel: true },
          dataZoom: [{ type: "inside" }],
          tooltip: {
            trigger: "axis",
            axisPointer: { lineStyle: { width: 1, color: "#888888" } },
            formatter: (items) => {
              if (!items || !items.length) return ""
              const index = items[0].dataIndex
              const row = rows[index]
              return [
                `#${index + 1}`,
                displayNightlord(row.nightlord) || "?",
                `${displayStatus(row.status)}(${displayDay(row.day)})`,
                `分数: ${row.points}`,
                row.date,
              ]
                .filter(Boolean)
                .join("<br>")
            },
          },
          xAxis: {
            type: "category",
            data: xAxisData,
            axisLabel: { show: false },
            axisTick: { show: false },
          },
          yAxis: {
            type: "value",
            min: 0,
            max: 9999,
          },
          legend: {
            bottom: 0,
            icon: "roundRect",
            itemStyle: { opacity: 1 },
          },
          series: [
            {
              type: "line",
              smooth: false,
              data: pointsData,
              connectNulls: false,
              lineStyle: { width: 2, color: "#7E57C2" },
            },
            ...Object.values(depthSeries),
          ],
        })

        window.addEventListener("resize", () => chart.resize())
      }

      function canonicalNightlord(value) {
        return value.endsWith("-everdark") ? value.slice(0, -9) : value
      }

      function renderNightlordChart(rows) {
        const grouped = new Map()
        rows.forEach((row) => {
          const key = canonicalNightlord(String(row.nightlord))
          if (!grouped.has(key)) grouped.set(key, { normal: 0, everdark: 0 })
          const bucket = grouped.get(key)
          if (String(row.nightlord).endsWith("-everdark")) {
            bucket.everdark += 1
          } else {
            bucket.normal += 1
          }
        })

        const names = Array.from(grouped.entries())
          .sort((a, b) => {
            const totalA = a[1].normal + a[1].everdark
            const totalB = b[1].normal + b[1].everdark
            return totalB - totalA
          })
          .map(([name]) => name)
        const everdarkCounts = names.map((name) => grouped.get(name).everdark)
        const normalCounts = names.map((name) => grouped.get(name).normal)

        const chart = echarts.init(document.getElementById("nightlord-chart"))
        chart.setOption({
          grid: { left: 10, right: 10, top: 20, bottom: 10, containLabel: true },
          tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
          xAxis: {
            type: "category",
            data: names.map((name) => displayNightlord(name)),
            axisLabel: { interval: 0, rotate: 25 },
          },
          yAxis: { type: "value" },
          series: [
            {
              name: "Everdark",
              type: "bar",
              stack: "total",
              itemStyle: { color: "#5b21b6" },
              data: everdarkCounts,
            },
            {
              name: "Normal",
              type: "bar",
              stack: "total",
              itemStyle: { color: "#a78bfa" },
              data: normalCounts,
            },
          ],
        })

        window.addEventListener("resize", () => chart.resize())
      }

      function renderStatusChart(rows) {
        const statusColors = {
          victory: "#16a34a",
          defeat: "#dc2626",
          quit: "#facc15",
          disconnected: "#94a3b8",
          invalid: "#64748b",
        }
        const grouped = new Map()
        rows.forEach((row) => {
          const key = String(row.status || "")
          grouped.set(key, (grouped.get(key) || 0) + 1)
        })

        const data = Array.from(grouped.entries())
          .sort((a, b) => b[1] - a[1])
          .map(([status, count]) => ({
            name: displayStatus(status),
            value: count,
            itemStyle: { color: statusColors[status] || "#cbd5e1" },
          }))

        const chart = echarts.init(document.getElementById("status-chart"))
        chart.setOption({
          tooltip: {
            trigger: "item",
            formatter: ({ name, value, percent }) => `${name}<br>${value} (${percent}%)`,
          },
          legend: {
            bottom: 0,
            left: "center",
          },
          series: [
            {
              name: "Status",
              type: "pie",
              radius: ["42%", "72%"],
              center: ["50%", "45%"],
              avoidLabelOverlap: true,
              itemStyle: {
                borderColor: "#ffffff",
                borderWidth: 2,
              },
              label: {
                formatter: "{b}: {c}",
              },
              data,
            },
          ],
        })

        window.addEventListener("resize", () => chart.resize())
      }

      function renderCharacterChart(rows) {
        const grouped = new Map()
        rows.forEach((row) => {
          if (row.team && row.team.length > 0) {
            const key = row.team[0]
            grouped.set(key, (grouped.get(key) || 0) + 1)
          }
        })

        const data = Array.from(grouped.entries())
          .sort((a, b) => b[1] - a[1])
          .map(([character, count]) => ({
            name: displayCharacter(character),
            value: count,
          }))

        const chart = echarts.init(document.getElementById("character-chart"))
        chart.setOption({
          tooltip: {
            trigger: "item",
            formatter: ({ name, value, percent }) => `${name}<br>${value} (${percent}%)`,
          },
          series: [
            {
              name: "Character",
              type: "pie",
              radius: ["42%", "72%"],
              center: ["50%", "45%"],
              avoidLabelOverlap: true,
              itemStyle: {
                borderColor: "#ffffff",
                borderWidth: 2,
              },
              label: {},
              data,
            },
          ],
        })

        window.addEventListener("resize", () => chart.resize())
      }

      function renderTeammatesChart(rows) {
        const grouped = new Map()
        rows.forEach((row) => {
          if (row.team && row.team.length > 2) {
            for (let i = 1; i < row.team.length; i++) {
              const key = row.team[i]
              grouped.set(key, (grouped.get(key) || 0) + 1)
            }
          }
        })

        const data = Array.from(grouped.entries())
          .sort((a, b) => b[1] - a[1])
          .map(([teammate, count]) => ({
            name: displayCharacter(teammate),
            value: count,
          }))

        const chart = echarts.init(document.getElementById("teammates-chart"))
        chart.setOption({
          tooltip: {
            trigger: "item",
            formatter: ({ name, value, percent }) => `${name}<br>${value} (${percent}%)`,
          },
          series: [
            {
              name: "Teammates",
              type: "pie",
              radius: ["42%", "72%"],
              center: ["50%", "45%"],
              avoidLabelOverlap: true,
              itemStyle: {
                borderColor: "#ffffff",
                borderWidth: 2,
              },
              label: {},
              data,
            },
          ],
        })

        window.addEventListener("resize", () => chart.resize())
      }

      function boot() {
        renderHeader()
        const rows = expeditions.map((row, index, arr) => ({
          ...row,
          number: arr.length - index,
        }))
        setStats(rows)
        renderTable(rows)
        renderPointsChart(rows)
        renderNightlordChart(rows)
        renderStatusChart(rows)
        renderCharacterChart(rows)
        renderTeammatesChart(rows)
      }

      boot()
    </script>
  </body>
</html>
